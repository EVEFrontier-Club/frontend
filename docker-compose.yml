# EVE Frontier Club Frontend - Local Development Stack
# Use this for testing locally: docker-compose up
# Production uses direct Dart deployment without containers.

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      BACKEND_URL: http://backend:8081
    volumes:
      - .:/app
    depends_on:
      - backend
    networks:
      - evefrontier

  # Mock backend for testing (if needed)
  backend:
    image: kennethreitz/httpbin
    ports:
      - "8081:80"
    networks:
      - evefrontier

  # Nginx reverse proxy (similar to production)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./.deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./build:/var/www/evefrontier-club:ro
    depends_on:
      - app
    networks:
      - evefrontier

networks:
  evefrontier:
    driver: bridge
