name: evefrontier_club_frontend
description: Modular tools and analytics for the EVE Frontier universe. Reputation systems, player metrics, and community infrastructure — built with Dart.
version: 0.0.1
homepage: https://evefrontier.club
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
     sdk: flutter
  jaspr: ^0.23.5
  jaspr_flutter_embed: ^0.4.11
  jaspr_router: ^0.9.0
  http: ^1.1.0

dev_dependencies:
  build_runner: ^2.15.1
  # Pinned: build_web_compilers >= 4.5.0 duplicates build_modules' module_library
  # builder, which collides with jaspr_tailwind. See dart-lang/build#4963.
  build_web_compilers: 4.4.19
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  jaspr_builder: ^0.23.5
  jaspr_lints: ^0.7.2
  jaspr_tailwind: ^0.3.6

jaspr:
  mode: server
  flutter: embedded

flutter:
  uses-material-design: true
