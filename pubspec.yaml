name: evefrontier_club_frontend
description: Modular tools and analytics for the EVE Frontier universe. Reputation systems, player metrics, and community infrastructure — built with Dart.
version: 0.0.1
homepage: https://evefrontier.club
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
     sdk: flutter
  jaspr: ^0.22.4
  jaspr_flutter_embed: ^0.4.10
  jaspr_router: ^0.8.1
  http: ^1.1.0

dev_dependencies:
  build_runner: ^2.13.1
  build_web_compilers: ^4.4.16
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  jaspr_builder: ^0.22.4
  jaspr_tailwind: ^0.3.6

jaspr:
  mode: server
  flutter: embedded

flutter:
  uses-material-design: true
